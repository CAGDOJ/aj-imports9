<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AJ Imports · Verificação da API</title><style>body{font:16px system-ui;margin:0;padding:26px;background:#f5f7fc;color:#173866}h1{font-size:22px}pre{background:white;border:1px solid #dfebf9;border-radius:8px;white-space:pre-wrap;padding:18px;overflow-wrap:anywhere;line-height:1.6}</style></head><body><h1>Verificação segura da API AJ Imports</h1><p>O teste utiliza somente pedidos sem autenticação e não altera dados.</p><pre id="out">Verificando...</pre><script>
(async()=>{
 const api='https://aj-imports9.carlosjralfa.chatgpt.site',out=document.getElementById('out');
 const results=[];
 async function check(label,url,options){
  try{
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),9500);
   let r;
   try{r=await fetch(url,{cache:'no-store',credentials:'omit',signal:controller.signal,...options})}finally{clearTimeout(timeout)}
   const detail=label.startsWith('POST login')?(' resposta '+(await r.text()).slice(0,250)) : '';
   results.push(label+': STATUS '+r.status+', CORS OK, tipo '+(r.headers.get('content-type')||'N/A')+detail);
  }catch(e){results.push(label+': ERRO '+String(e))}
  out.textContent=results.join('\n');
 }
 await check('Catálogo público',api+'/api/products');
 await check('Gerência sem autorização',api+'/api/manager',{headers:{'Authorization':'Bearer '+('0'.repeat(64))}});
 await check('Pré-verificação do login',api+'/api/auth',{method:'OPTIONS',headers:{'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type,authorization'}});
 await check('POST login inválido (sem credenciais)',api+'/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'test_request_without_login'})});
})();
</script></body></html>
